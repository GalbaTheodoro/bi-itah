<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI Itah</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="/img/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BI Itah">
  <meta name="theme-color" content="#0b3f8a">
</head>
<body>
  <aside class="lateral" id="lateral" aria-label="Menu de relatórios">
    <div class="lat-topo">
      <div class="logo"><img src="/img/logo.png" alt=""><span class="rot">BI Itah</span></div>
      <button class="lat-recolher" id="recolher" type="button" title="Recolher menu" aria-label="Recolher menu">«</button>
    </div>
    <div class="lat-busca"><input id="menu-busca" type="search" placeholder="Buscar relatório…" autocomplete="off"></div>
    <nav id="menu"></nav>
    <div class="lat-rodape">
      <button class="btn-instalar" type="button" hidden>📲 <span class="rot">Instalar app</span></button>
      <div class="lat-user"><span class="avatar" id="avatar"></span><span class="rot" id="usuario"></span></div>
      <button id="sair" type="button" title="Sair">🚪 <span class="rot">Sair</span></button>
    </div>
  </aside>
  <div class="fundo-menu" id="fundo-menu"></div>
  <div class="corpo">
    <header class="topo">
      <button class="hamb" id="hamb" type="button" aria-label="Abrir menu">☰</button>
      <div class="topo-titulo"><span id="titulo-grupo"></span><strong id="titulo-pagina"></strong></div>
      <div class="topo-acoes">
        <button class="btn sec" id="btn-pdf" type="button" title="Imprimir ou salvar em PDF">🖨️ <span>PDF</span></button>
        <button class="btn sec" id="btn-excel" type="button" title="Baixar em Excel (.xlsx)">📊 <span>Excel</span></button>
      </div>
    </header>
    <main id="conteudo"></main>
  </div>

  <script src="/vendor/chart.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/exportar.js"></script>
  <!-- Cada relatório é um arquivo. Para criar um novo, copie rel-comparativo.js e registre com BI.registrar(...) -->
  <script src="/js/rel-comparativo.js"></script>
  <script src="/js/rel-gs.js"></script>
  <script src="/js/rel-compravenda.js"></script>
  <script src="/js/rel-lucro.js"></script>
  <script src="/js/rel-embarque.js"></script>
  <script src="/js/rel-estoque.js"></script>
  <script src="/js/rel-rastreabilidade.js"></script>
  <script src="/js/rel-acessos.js"></script>
  <script>BI.iniciar();</script>
  <script src="/js/instalar.js"></script>
</body>
</html>
